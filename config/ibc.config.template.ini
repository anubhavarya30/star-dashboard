# STAR — IBC config TEMPLATE (no secrets). Copy to ~/ibc/config.ini and fill in
# your PAPER credentials there (that file lives OUTSIDE the repo and is never
# committed). IBC auto-logs-into IB Gateway and auto-restarts it = hands-off.

# ---- Credentials (PAPER account — fill these in ~/ibc/config.ini, NOT here) ----
IbLoginId=YOUR_PAPER_USERNAME
IbPassword=YOUR_PAPER_PASSWORD
TradingMode=paper

# ---- Gateway, not TWS ----
GatewayOrTws=gateway

# ---- API: expose Gateway on 7497 so STAR needs NO code change; allow orders ----
OverrideTwsApiPort=7497
ReadOnlyApi=no
AcceptIncomingConnectionAction=accept
AcceptNonBrokerageAccountWarning=yes
AllowBlindTrading=yes

# ---- Stay up; daily auto-restart (re-logs in WITHOUT credentials prompt) ----
IbAutoClosedown=no
ClosedownAt=
AutoRestartTime=11:45 PM
AutoLogoffTime=

# ---- 2FA: paper accounts don't use it; for live, IBC can notify ----
ExistingSessionDetectedAction=primary
LogComponents=never
