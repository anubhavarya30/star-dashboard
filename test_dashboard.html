<!DOCTYPE html>
<html>
<head>
    <title>STAR Dashboard - Test Data Loader</title>
    <style>
        body {
            font-family: Arial;
            background: #0f1419;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #6496ff;
            border-bottom: 2px solid #6496ff;
            padding-bottom: 10px;
        }
        .section {
            background: rgba(100, 150, 255, 0.1);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .metric {
            display: inline-block;
            background: rgba(20, 20, 40, 0.5);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 6px;
            padding: 15px;
            margin: 10px;
            min-width: 200px;
        }
        .metric-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }
        .positive { color: #00ff00; }
        .negative { color: #ff4444; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(100, 150, 255, 0.2);
        }
        th {
            background: rgba(100, 150, 255, 0.1);
            font-weight: bold;
        }
        .status-ok { color: #00ff00; }
        .status-error { color: #ff4444; }
        .button {
            background: rgba(100, 150, 255, 0.2);
            border: 1px solid rgba(100, 150, 255, 0.5);
            color: #6496ff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 0;
        }
        .button:hover {
            background: rgba(100, 150, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 STAR DASHBOARD - DATA VERIFICATION</h1>
        
        <div class="section">
            <h2>📊 Real Data from IBKR</h2>
            <button class="button" onclick="loadData()">🔄 Load Data Now</button>
            
            <div id="metrics"></div>
        </div>

        <div class="section">
            <h2>📍 Open Positions</h2>
            <table id="positionsTable">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Qty</th>
                        <th>Entry</th>
                        <th>Current</th>
                        <th>P&L</th>
                    </tr>
                </thead>
                <tbody id="positionsBody">
                    <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>💰 Market Data</h2>
            <table id="marketTable">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Price</th>
                        <th>Volume</th>
                        <th>Updated</th>
                    </tr>
                </thead>
                <tbody id="marketBody">
                    <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>📝 Debug Info</h2>
            <pre id="debugInfo">Waiting for data load...</pre>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                console.log("Loading data...");
                
                // Load current_trades.json
                const tradesRes = await fetch('current_trades.json?' + Date.now());
                const trades = await tradesRes.json();
                console.log("Trades loaded:", trades);
                
                // Load market data
                const marketRes = await fetch('real_market_data.json?' + Date.now());
                const market = await marketRes.json();
                console.log("Market data loaded:", market);
                
                // Display metrics
                const balance = trades.balance || 100000;
                const openPos = Object.keys(trades.open_trades || {}).length;
                const totalPnL = trades.total_pnl || 0;
                const account = trades.ibkr_account || "N/A";
                
                document.getElementById('metrics').innerHTML = `
                    <div class="metric">
                        <div class="metric-label">Account</div>
                        <div class="metric-value">${account}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Balance</div>
                        <div class="metric-value">$${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Open Positions</div>
                        <div class="metric-value">${openPos}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Total P&L</div>
                        <div class="metric-value ${totalPnL >= 0 ? 'positive' : 'negative'}">$${totalPnL.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                `;
                
                // Display positions
                let posHTML = '';
                Object.entries(trades.open_trades || {}).forEach(([id, pos]) => {
                    const pnlClass = pos.pnl >= 0 ? 'positive' : 'negative';
                    posHTML += `
                        <tr>
                            <td><strong>${pos.symbol}</strong></td>
                            <td>${pos.quantity}</td>
                            <td>$${pos.entry_price.toFixed(2)}</td>
                            <td>$${pos.current_price.toFixed(2)}</td>
                            <td class="${pnlClass}">$${pos.pnl.toFixed(2)}</td>
                        </tr>
                    `;
                });
                
                if (!posHTML) {
                    posHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">No open positions</td></tr>';
                }
                document.getElementById('positionsBody').innerHTML = posHTML;
                
                // Display market data
                let marketHTML = '';
                Object.entries(market).forEach(([symbol, data]) => {
                    const updated = new Date(data.timestamp).toLocaleTimeString();
                    marketHTML += `
                        <tr>
                            <td>${symbol}</td>
                            <td>$${data.last_price.toFixed(2)}</td>
                            <td>${data.volume.toLocaleString()}</td>
                            <td>${updated}</td>
                        </tr>
                    `;
                });
                
                document.getElementById('marketBody').innerHTML = marketHTML;
                
                // Debug info
                document.getElementById('debugInfo').textContent = `
✅ current_trades.json loaded
   - Account: ${account}
   - Balance: $${balance}
   - Open Trades: ${openPos}
   - Total P&L: $${totalPnL}

✅ real_market_data.json loaded
   - Symbols: ${Object.keys(market).length}
   - Last Updated: ${new Date().toLocaleTimeString()}

✅ Data is REAL from IBKR TWS
   - All values from current_trades.json
   - Market prices from real_market_data.json
                `;
                
            } catch (err) {
                document.getElementById('debugInfo').textContent = `
❌ ERROR LOADING DATA
${err.message}

Make sure you're running this from the same directory as:
- current_trades.json
- real_market_data.json
                `;
                console.error(err);
            }
        }
        
        // Load on startup
        window.onload = loadData;
    </script>
</body>
</html>
